<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <radialGradient id="pillarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes bob1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes bob2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
    @keyframes bob3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes bob4 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes lineFlow {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .pod-1 { animation: bob1 4.5s ease-in-out infinite; }
    .pod-2 { animation: bob2 5.2s ease-in-out infinite 0.5s; }
    .pod-3 { animation: bob3 4.2s ease-in-out infinite 1.0s; }
    .pod-4 { animation: bob4 4.8s ease-in-out infinite 1.5s; }
    .flow-line { stroke-dasharray: 8, 8; animation: lineFlow 2s linear infinite; }
  </style>

  <rect width="1100" height="360" rx="14" fill="#030712" />

  <!-- Background Data Flow Mesh -->
  <path d="M 120 180 Q 380 90 600 180 T 1000 180" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 120 180 Q 380 90 600 180 T 1000 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" class="flow-line" />

  <!-- POD 1: Speed Typing -->
  <g class="pod-1" transform="translate(60, 40)">
    <!-- 3D Pedestal Base -->
    <polygon points="100,240 180,265 100,290 20,265" fill="#0c4a6e" opacity="0.6" />
    <polygon points="20,265 100,290 100,305 20,280" fill="#075985" opacity="0.8" />
    <polygon points="100,290 180,265 180,280 100,305" fill="#0369a1" opacity="0.7" />

    <!-- Card -->
    <rect x="15" y="45" width="170" height="200" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.6" filter="url(#fGlow)" />
    <!-- 3D Cube Icon -->
    <polygon points="100,70 125,82 100,95 75,82" fill="#38bdf8" />
    <polygon points="75,82 100,95 100,118 75,105" fill="#0284c7" />
    <polygon points="100,95 125,82 125,105 100,118" fill="#0369a1" />

    <text x="100" y="145" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">SPEED TYPING</text>
    <text x="100" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Burst Rhythm &amp; WPM</text>
    <rect x="35" y="185" width="130" height="26" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
    <text x="100" y="202" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#7dd3fc">120+ WPM Target</text>
  </g>

  <!-- POD 2: Polyglot Languages -->
  <g class="pod-2" transform="translate(310, 30)">
    <!-- 3D Pedestal Base -->
    <polygon points="100,250 180,275 100,300 20,275" fill="#064e3b" opacity="0.6" />
    <polygon points="20,275 100,300 100,315 20,290" fill="#047857" opacity="0.8" />
    <polygon points="100,300 180,275 180,290 100,315" fill="#059669" opacity="0.7" />

    <!-- Card -->
    <rect x="15" y="55" width="170" height="200" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.6" filter="url(#fGlow)" />
    <!-- 3D Cube Icon -->
    <polygon points="100,80 125,92 100,105 75,92" fill="#34d399" />
    <polygon points="75,92 100,105 100,128 75,115" fill="#059669" />
    <polygon points="100,105 125,92 125,115 100,128" fill="#047857" />

    <text x="100" y="155" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">POLYGLOT VOCAB</text>
    <text x="100" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Spanish, French, Japanese</text>
    <rect x="35" y="195" width="130" height="26" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8" />
    <text x="100" y="212" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#6ee7b7">SM-2 Spaced Recall</text>
  </g>

  <!-- POD 3: Mental Math -->
  <g class="pod-3" transform="translate(560, 45)">
    <!-- 3D Pedestal Base -->
    <polygon points="100,235 180,260 100,285 20,260" fill="#78350f" opacity="0.6" />
    <polygon points="20,260 100,285 100,300 20,275" fill="#b45309" opacity="0.8" />
    <polygon points="100,285 180,260 180,275 100,300" fill="#d97706" opacity="0.7" />

    <!-- Card -->
    <rect x="15" y="40" width="170" height="200" rx="12" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.6" filter="url(#fGlow)" />
    <!-- 3D Cube Icon -->
    <polygon points="100,65 125,77 100,90 75,77" fill="#fbbf24" />
    <polygon points="75,77 100,90 100,113 75,100" fill="#d97706" />
    <polygon points="100,90 125,77 125,100 100,113" fill="#b45309" />

    <text x="100" y="140" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">MENTAL MATH</text>
    <text x="100" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Arithmetic Shortcuts</text>
    <rect x="35" y="180" width="130" height="26" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="0.8" />
    <text x="100" y="197" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#fde68a">&lt; 3s Quick Answers</text>
  </g>

  <!-- POD 4: System Code -->
  <g class="pod-4" transform="translate(810, 35)">
    <!-- 3D Pedestal Base -->
    <polygon points="100,245 180,270 100,295 20,270" fill="#4c1d95" opacity="0.6" />
    <polygon points="20,270 100,295 100,310 20,285" fill="#6d28d9" opacity="0.8" />
    <polygon points="100,295 180,270 180,285 100,310" fill="#7c3aed" opacity="0.7" />

    <!-- Card -->
    <rect x="15" y="50" width="170" height="200" rx="12" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-width="1.6" filter="url(#fGlow)" />
    <!-- 3D Cube Icon -->
    <polygon points="100,75 125,87 100,100 75,87" fill="#c084fc" />
    <polygon points="75,87 100,100 100,123 75,110" fill="#9333ea" />
    <polygon points="100,100 125,87 125,110 100,123" fill="#7e22ce" />

    <text x="100" y="150" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">SYSTEM CODE</text>
    <text x="100" y="173" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Big-O, Bitwise, Regex</text>
    <rect x="35" y="190" width="130" height="26" rx="6" fill="#4c1d95" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="0.8" />
    <text x="100" y="207" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#e9d5ff">Algorithmic Reflexes</text>
  </g>
</svg>
