<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.8)); }
    }
    @keyframes dashCycle {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    .node-anim { transform-origin: center; animation: pulseNode 3s ease-in-out infinite; }
    .dashed-wire { stroke-dasharray: 6, 6; animation: dashCycle 1.5s linear infinite; }
  </style>

  <rect width="1000" height="340" rx="14" fill="#020617" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Top -->
  <text x="50" y="44" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="1.5">
    COGNITIVE ARCHITECTURE &amp; DATA ENGINE
  </text>
  <text x="50" y="66" font-family="sans-serif" font-size="12" fill="#64748b">
    High-frequency micro-session lifecycle from stimulus to SM-2 consolidation
  </text>

  <!-- Connective Wires -->
  <path d="M 220 190 L 320 190" stroke="#0284c7" stroke-width="2.5" class="dashed-wire" />
  <path d="M 480 190 L 580 190" stroke="#8b5cf6" stroke-width="2.5" class="dashed-wire" />
  <path d="M 740 190 L 840 190" stroke="#10b981" stroke-width="2.5" class="dashed-wire" />

  <!-- Node 1: Fast Stimulus -->
  <g class="node-anim" transform="translate(60, 110)">
    <rect x="0" y="0" width="160" height="150" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <polygon points="80,18 105,30 80,42 55,30" fill="#38bdf8" />
    <text x="80" y="72" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">1. STIMULUS</text>
    <text x="80" y="94" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">90s Timed Drill</text>
    <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Fisher-Yates Shuffle</text>
    <rect x="25" y="125" width="110" height="16" rx="4" fill="#0369a1" opacity="0.4" />
    <text x="80" y="136" text-anchor="middle" font-family="monospace" font-size="9" fill="#7dd3fc">ZERO-REPEAT</text>
  </g>

  <!-- Node 2: Cognitive Engine -->
  <g class="node-anim" transform="translate(320, 100)">
    <rect x="0" y="0" width="160" height="170" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.8" />
    <polygon points="80,22 105,34 80,46 55,34" fill="#c084fc" />
    <text x="80" y="76" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">2. SM-2 ENGINE</text>
    <text x="80" y="98" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#e9d5ff">Ease Factor (EF)</text>
    <text x="80" y="116" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#e9d5ff">Interval Multiplier</text>
    <text x="80" y="134" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#e9d5ff">Quality Score (0-5)</text>
    <rect x="25" y="145" width="110" height="16" rx="4" fill="#6d28d9" opacity="0.5" />
    <text x="80" y="156" text-anchor="middle" font-family="monospace" font-size="9" fill="#f3e8ff">ADAPTIVE CURVE</text>
  </g>

  <!-- Node 3: Encrypted State -->
  <g class="node-anim" transform="translate(580, 110)">
    <rect x="0" y="0" width="160" height="150" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <polygon points="80,18 105,30 80,42 55,30" fill="#34d399" />
    <text x="80" y="72" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">3. PERSISTENCE</text>
    <text x="80" y="94" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Multi-User Profiles</text>
    <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">PBKDF2 Password</text>
    <rect x="25" y="125" width="110" height="16" rx="4" fill="#065f46" opacity="0.4" />
    <text x="80" y="136" text-anchor="middle" font-family="monospace" font-size="9" fill="#6ee7b7">OFFLINE FIRST</text>
  </g>

  <!-- Node 4: Telemetry & Analytics -->
  <g class="node-anim" transform="translate(840, 110)">
    <rect x="0" y="0" width="160" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <polygon points="80,18 105,30 80,42 55,30" fill="#fbbf24" />
    <text x="80" y="72" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">4. TELEMETRY</text>
    <text x="80" y="94" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">84-Day Heatmaps</text>
    <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Peak Time Window</text>
    <rect x="25" y="125" width="110" height="16" rx="4" fill="#78350f" opacity="0.4" />
    <text x="80" y="136" text-anchor="middle" font-family="monospace" font-size="9" fill="#fde68a">DEEP ANALYTICS</text>
  </g>
</svg>
